<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SKAR — Premium cases from Riyadh. Minimalist design, supreme quality.">
    <meta name="keywords" content="SKAR, cases, premium, Riyadh, minimalist, luxury">
    <meta name="author" content="SKAR">
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="SKAR">
    <meta property="og:description" content="Premium cases from Riyadh. Minimalist design, supreme quality.">
    
    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="SKAR">
    <meta name="twitter:description" content="Premium cases from Riyadh. Minimalist design, supreme quality.">
    
    <title>SKAR</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Top Header with Logo -->
    <header class="top-header">
        <h1 class="header-logo">SKAR</h1>
        <p class="header-location">Riyadh</p>
    </header>

    <!-- Sidebar Menu (Desktop) -->
    <aside class="sidebar">
        <nav class="sidebar-nav">
            <a href="#" class="menu-item" data-category="new">new</a>
            <a href="#" class="menu-item active" data-category="cases">cases</a>
            <a href="#" class="menu-item" data-category="refills">refills</a>
            <a href="#" class="menu-item" data-category="all">all</a>
        </nav>
    </aside>

    <!-- Mobile Navigation -->
    <nav class="mobile-nav">
        <div class="mobile-nav-container">
            <a href="#" class="mobile-menu-item" data-category="new">new</a>
            <a href="#" class="mobile-menu-item active" data-category="cases">cases</a>
            <a href="#" class="mobile-menu-item" data-category="refills">refills</a>
            <a href="#" class="mobile-menu-item" data-category="all">all</a>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="main-content">
        <!-- Shop Grid View (Default visible) -->
        <section class="shop-view" id="shopView">
            <div class="product-grid" id="productGrid">
                <!-- Off White -->
                <article class="product-card" data-color="off-white">
                    <div class="product-image-container">
                        <img src="images/off-white.png" alt="Off White Case">
                    </div>
                    <div class="product-info">
                        <h3 class="product-name">Off White</h3>
                        <p class="product-price">
                            <span class="price-amount">149</span>
                            <img src="Saudi_Riyal_Symbol.svg" alt="SAR" class="sar-symbol">
                        </p>
                    </div>
                </article>

                <!-- Metallic Titanium -->
                <article class="product-card" data-color="titanium">
                    <div class="product-image-container">
                        <img src="images/metalic-titanium.png" alt="Metallic Titanium Case">
                    </div>
                    <div class="product-info">
                        <h3 class="product-name">Metallic Titanium</h3>
                        <p class="product-price">
                            <span class="price-amount">199</span>
                            <img src="Saudi_Riyal_Symbol.svg" alt="SAR" class="sar-symbol">
                        </p>
                    </div>
                </article>

                <!-- Matte Black (Locked) -->
                <article class="product-card locked-product" data-color="matte-black">
                    <div class="product-image-container">
                        <img src="images/matte-black.png" alt="Matte Black Case">
                        <div class="lock-overlay">
                            <svg class="lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="5" y="11" width="14" height="10" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </div>
                    </div>
                    <div class="product-info">
                        <h3 class="product-name">Matte Black</h3>
                        <p class="product-status">Invite Only</p>
                    </div>
                </article>

                <!-- Pink (Locked) -->
                <article class="product-card locked-product" data-color="pink">
                    <div class="product-image-container">
                        <img src="images/pink.png" alt="Pink Case">
                        <div class="lock-overlay">
                            <svg class="lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="5" y="11" width="14" height="10" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </div>
                    </div>
                    <div class="product-info">
                        <h3 class="product-name">Pink</h3>
                        <p class="product-status">Invite Only</p>
                    </div>
                </article>
            </div>
        </section>
    </main>

    <script src="main.js"></script>
</body>
</html>
