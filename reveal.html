<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKAR — Your Sign Revealed</title>
    <meta name="description" content="Your elemental arsenal awaits.">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;600;700&family=Inter:wght@100;200;300;400;500&display=swap" rel="stylesheet">
    <style>
        /* Page-specific styles */
        .reveal-section {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }
        
        .reveal-container {
            text-align: center;
            max-width: 900px;
            width: 100%;
            padding: 2rem;
        }
        
        .zodiac-sign {
            font-family: var(--serif);
            font-size: clamp(3rem, 8vw, 7rem);
            font-weight: 700;
            letter-spacing: 0.05em;
            margin-bottom: 1rem;
            opacity: 0;
            animation: glitchFadeIn 1.5s ease 0.5s forwards;
            position: relative;
        }
        
        .zodiac-verdict {
            font-family: var(--sans);
            font-size: clamp(1rem, 2vw, 1.5rem);
            font-weight: 300;
            font-style: italic;
            color: rgba(255,255,255,0.8);
            margin-bottom: 4rem;
            opacity: 0;
            animation: fadeInUp 1s ease 1s forwards;
        }
        
        .scent-cases {
            display: flex;
            gap: 2rem;
            justify-content: center;
            margin-bottom: 4rem;
            flex-wrap: wrap;
            opacity: 0;
            animation: fadeInUp 1s ease 1.5s forwards;
        }
        
        .scent-case {
            width: 200px;
            height: 280px;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            transition: var(--transition-medium);
        }
        
        .scent-case:hover {
            transform: translateY(-10px);
        }
        
        .case-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.9;
            transition: var(--transition-medium);
        }
        
        .scent-case:hover .case-background {
            opacity: 1;
        }
        
        .case-glow {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 0;
            height: 0;
            background: radial-gradient(circle, rgba(255,255,255,0.3) 0%, transparent 70%);
            opacity: 0;
            transition: var(--transition-slow);
            pointer-events: none;
        }
        
        .scent-case:hover .case-glow {
            width: 200%;
            height: 200%;
            opacity: 1;
        }
        
        .case-content {
            position: relative;
            z-index: 2;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        
        .scent-name {
            font-family: var(--sans);
            font-size: 0.875rem;
            font-weight: 400;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--white-pure);
            text-align: center;
            writing-mode: vertical-rl;
            text-orientation: mixed;
        }
        
        .claim-arsenal-button {
            background: transparent;
            border: 1px solid var(--white-pure);
            color: var(--white-pure);
            padding: 1.25rem 4rem;
            font-family: var(--sans);
            font-size: 0.875rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: var(--transition-medium);
            opacity: 0;
            animation: fadeInUp 1s ease 2s forwards;
        }
        
        .claim-arsenal-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255,255,255,0.1);
        }
        
        .claim-arsenal-button:active {
            transform: translateY(0) scale(0.98);
        }
        
        /* Glitch fade in animation */
        @keyframes glitchFadeIn {
            0% {
                opacity: 0;
                transform: scale(1.1);
                filter: blur(10px);
            }
            10% {
                opacity: 0.5;
                transform: scale(1.05) translate(-2px, 2px);
                filter: blur(5px);
                text-shadow: -2px 0 var(--fire-red), 2px 0 var(--water-blue);
            }
            20% {
                opacity: 0.3;
                transform: scale(1.08) translate(2px, -2px);
                filter: blur(3px);
            }
            30% {
                opacity: 0.8;
                transform: scale(1.02) translate(-1px, 1px);
                filter: blur(1px);
                text-shadow: -1px 0 var(--fire-red), 1px 0 var(--water-blue);
            }
            40% {
                opacity: 0.6;
                transform: scale(1.04) translate(1px, -1px);
                filter: blur(2px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translate(0, 0);
                filter: blur(0);
                text-shadow: none;
            }
        }
        
        /* Element-specific case styles */
        .fire-case .case-background {
            background: linear-gradient(135deg, var(--fire-red) 0%, #4B0000 100%);
        }
        
        .earth-case .case-background {
            background: linear-gradient(135deg, var(--earth-nude) 0%, #8B7355 100%);
        }
        
        .air-case .case-background {
            background: linear-gradient(135deg, #1a1a1a 0%, var(--black-pure) 100%);
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        .water-case .case-background {
            background: linear-gradient(135deg, var(--water-blue) 0%, #000A1A 100%);
        }
        
        /* Back link */
        .back-link {
            position: absolute;
            top: 2rem;
            left: 2rem;
            font-family: var(--sans);
            font-size: 0.875rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--gray-muted);
            text-decoration: none;
            transition: var(--transition-fast);
            z-index: 10;
        }
        
        .back-link:hover {
            color: var(--white-pure);
        }
        
        /* Loading state */
        .loading {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <!-- Smoke Texture Background -->
    <div class="smoke-container">
        <div class="smoke-layer smoke-1"></div>
        <div class="smoke-layer smoke-2"></div>
        <div class="smoke-layer smoke-3"></div>
        <div class="smoke-layer smoke-4"></div>
    </div>
    
    <!-- Secret Society Symbol -->
    <div class="secret-symbol" aria-hidden="true">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="45" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.1"/>
            <polygon points="50,20 65,40 60,65 40,65 35,40" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.1"/>
        </svg>
    </div>
    
    <!-- Back Link -->
    <a href="birth-date.html" class="back-link">← BACK</a>
    
    <!-- Reveal Section -->
    <section class="reveal-section">
        <div class="reveal-container loading" id="revealContainer">
            <h1 class="zodiac-sign" id="zodiacSign"></h1>
            <p class="zodiac-verdict" id="zodiacVerdict"></p>
            
            <div class="scent-cases" id="scentCases">
                <!-- Cases will be dynamically inserted -->
            </div>
            
            <button class="claim-arsenal-button" id="claimButton">
                <span class="button-text">CLAIM YOUR ARSENAL</span>
                <span class="button-glow"></span>
            </button>
        </div>
    </section>
    
    <script src="zodiac.js"></script>
    <script>
        // Get zodiac sign from session storage
        const zodiacSign = sessionStorage.getItem('zodiacSign');
        
        if (!zodiacSign) {
            // Redirect to birth date page if no sign
            window.location.href = 'birth-date.html';
        } else {
            // Get zodiac data
            const data = getZodiacData(zodiacSign);
            
            if (data) {
                // Update content
                document.getElementById('zodiacSign').textContent = `${data.name} — ${data.subtitle}`;
                document.getElementById('zodiacVerdict').textContent = data.verdict;
                
                // Create scent cases
                const casesContainer = document.getElementById('scentCases');
                data.scents.forEach((scent, index) => {
                    const caseElement = document.createElement('div');
                    caseElement.className = `scent-case ${data.element}-case`;
                    caseElement.innerHTML = `
                        <div class="case-background"></div>
                        <div class="case-glow"></div>
                        <div class="case-content">
                            <span class="scent-name">${scent}</span>
                        </div>
                    `;
                    caseElement.style.animationDelay = `${1.5 + (index * 0.1)}s`;
                    casesContainer.appendChild(caseElement);
                });
                
                // Show content
                document.getElementById('revealContainer').classList.remove('loading');
                
                // Claim button click
                document.getElementById('claimButton').addEventListener('click', () => {
                    // Store bundle data
                    sessionStorage.setItem('selectedBundle', JSON.stringify({
                        sign: data.name,
                        scents: data.scents,
                        element: data.element,
                        elementColor: data.elementColor
                    }));
                    
                    // Transition to checkout
                    document.body.style.opacity = '0';
                    setTimeout(() => {
                        window.location.href = 'checkout.html';
                    }, 500);
                });
            } else {
                // Invalid sign, redirect
                window.location.href = 'birth-date.html';
            }
        }
        
        // Enhanced smoke parallax
        let mouseX = 0;
        let mouseY = 0;
        let currentX = 0;
        let currentY = 0;
        
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
            mouseY = (e.clientY / window.innerHeight - 0.5) * 2;
        });
        
        function animateSmoke() {
            currentX += (mouseX - currentX) * 0.05;
            currentY += (mouseY - currentY) * 0.05;
            
            const smokeLayers = document.querySelectorAll('.smoke-layer');
            smokeLayers.forEach((layer, index) => {
                const speed = (index + 1) * 10;
                const x = currentX * speed;
                const y = currentY * speed;
                
                layer.style.transform = `translate(${x}px, ${y}px)`;
            });
            
            requestAnimationFrame(animateSmoke);
        }
        
        animateSmoke();
    </script>
</body>
</html>
