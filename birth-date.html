<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKAR — Discover Your Sign</title>
    <meta name="description" content="Enter your birth date to reveal your elemental arsenal.">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:wght@400;600&family=Inter:wght@100;200;300;400;500&display=swap" rel="stylesheet">
    <style>
        /* Page-specific styles */
        .birth-date-section {
            position: relative;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2;
        }
        
        .birth-date-container {
            text-align: center;
            max-width: 600px;
            width: 100%;
            padding: 2rem;
            opacity: 0;
            animation: fadeInUp 1.5s ease 0.5s forwards;
        }
        
        .birth-date-title {
            font-family: var(--serif);
            font-size: clamp(2.5rem, 6vw, 5rem);
            font-weight: 400;
            color: var(--white-pure);
            margin-bottom: 1rem;
            letter-spacing: 0.02em;
        }
        
        .birth-date-subtitle {
            font-family: var(--sans);
            font-size: 0.875rem;
            font-weight: 300;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--gray-muted);
            margin-bottom: 4rem;
        }
        
        .date-inputs {
            display: flex;
            gap: 2rem;
            justify-content: center;
            margin-bottom: 4rem;
            flex-wrap: wrap;
        }
        
        .date-input-group {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
        }
        
        .date-label {
            font-family: var(--sans);
            font-size: 0.75rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--gray-muted);
        }
        
        .date-input {
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: var(--white-pure);
            font-family: var(--serif);
            font-size: 1.75rem;
            font-weight: 400;
            width: 100px;
            height: 60px;
            text-align: center;
            transition: var(--transition-fast);
            letter-spacing: 0.1em;
        }
        
        .date-input:focus {
            outline: none;
            border-color: var(--white-pure);
            box-shadow: 0 0 20px rgba(255,255,255,0.1);
        }
        
        .date-input::placeholder {
            color: rgba(255,255,255,0.2);
        }
        
        .reveal-button {
            background: transparent;
            border: 1px solid var(--white-pure);
            color: var(--white-pure);
            padding: 1.25rem 4rem;
            font-family: var(--sans);
            font-size: 0.875rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: var(--transition-medium);
            opacity: 0.5;
            pointer-events: none;
        }
        
        .reveal-button.active {
            opacity: 1;
            pointer-events: auto;
        }
        
        .reveal-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(255,255,255,0.1);
        }
        
        .reveal-button:active {
            transform: translateY(0) scale(0.98);
        }
        
        /* Navigation link */
        .shop-link {
            position: absolute;
            top: 2rem;
            right: 2rem;
            font-family: var(--sans);
            font-size: 0.875rem;
            font-weight: 300;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--gray-muted);
            text-decoration: none;
            transition: var(--transition-fast);
            z-index: 10;
        }
        
        .shop-link:hover {
            color: var(--white-pure);
        }
        
        /* Error message */
        .error-message {
            font-family: var(--sans);
            font-size: 0.75rem;
            color: var(--fire-red);
            margin-top: 1rem;
            opacity: 0;
            transition: var(--transition-fast);
        }
        
        .error-message.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <!-- Smoke Texture Background -->
    <div class="smoke-container">
        <div class="smoke-layer smoke-1"></div>
        <div class="smoke-layer smoke-2"></div>
        <div class="smoke-layer smoke-3"></div>
        <div class="smoke-layer smoke-4"></div>
    </div>
    
    <!-- Secret Society Symbol -->
    <div class="secret-symbol" aria-hidden="true">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <circle cx="50" cy="50" r="45" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.1"/>
            <polygon points="50,20 65,40 60,65 40,65 35,40" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.1"/>
        </svg>
    </div>
    
    <!-- Shop Link -->
    <a href="shop.html" class="shop-link">BROWSE ALL</a>
    
    <!-- Birth Date Section -->
    <section class="birth-date-section">
        <div class="birth-date-container">
            <h1 class="birth-date-title">Enter Your Birth Date</h1>
            <p class="birth-date-subtitle">We will reveal your sign</p>
            
            <form id="birthDateForm">
                <div class="date-inputs">
                    <div class="date-input-group">
                        <label class="date-label" for="day">Day</label>
                        <input type="number" id="day" class="date-input" min="1" max="31" placeholder="DD" required>
                    </div>
                    <div class="date-input-group">
                        <label class="date-label" for="month">Month</label>
                        <input type="number" id="month" class="date-input" min="1" max="12" placeholder="MM" required>
                    </div>
                    <div class="date-input-group">
                        <label class="date-label" for="year">Year</label>
                        <input type="number" id="year" class="date-input" min="1900" max="2024" placeholder="YYYY" required>
                    </div>
                </div>
                
                <button type="submit" class="reveal-button" id="revealButton">
                    <span class="button-text">REVEAL</span>
                    <span class="button-glow"></span>
                </button>
                
                <p class="error-message" id="errorMessage"></p>
            </form>
        </div>
    </section>
    
    <script src="zodiac.js"></script>
    <script>
        // Form validation and submission
        const form = document.getElementById('birthDateForm');
        const dayInput = document.getElementById('day');
        const monthInput = document.getElementById('month');
        const yearInput = document.getElementById('year');
        const revealButton = document.getElementById('revealButton');
        const errorMessage = document.getElementById('errorMessage');
        
        // Input validation
        function validateInputs() {
            const day = parseInt(dayInput.value);
            const month = parseInt(monthInput.value);
            const year = parseInt(yearInput.value);
            
            const isValid = day >= 1 && day <= 31 && 
                          month >= 1 && month <= 12 && 
                          year >= 1900 && year <= 2024;
            
            if (isValid) {
                revealButton.classList.add('active');
            } else {
                revealButton.classList.remove('active');
            }
        }
        
        // Add input listeners
        [dayInput, monthInput, yearInput].forEach(input => {
            input.addEventListener('input', validateInputs);
            
            // Auto-focus next field
            input.addEventListener('input', function() {
                if (this.value.length === this.maxLength) {
                    const next = this.parentElement.nextElementSibling;
                    if (next) {
                        next.querySelector('input').focus();
                    }
                }
            });
        });
        
        // Set max length
        dayInput.maxLength = 2;
        monthInput.maxLength = 2;
        yearInput.maxLength = 4;
        
        // Form submission
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const day = parseInt(dayInput.value);
            const month = parseInt(monthInput.value);
            
            // Validate date
            const daysInMonth = [31, 29, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
            if (day > daysInMonth[month - 1]) {
                errorMessage.textContent = 'Invalid date';
                errorMessage.classList.add('show');
                return;
            }
            
            // Calculate zodiac sign
            const zodiacSign = getZodiacSign(month, day);
            
            // Store in session storage
            sessionStorage.setItem('zodiacSign', zodiacSign);
            
            // Add transition effect
            document.body.style.opacity = '0';
            
            setTimeout(() => {
                window.location.href = 'reveal.html';
            }, 500);
        });
    </script>
</body>
</html>
